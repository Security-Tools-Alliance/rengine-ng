name: rengine

services:
  db:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-postgres-v${RENGINE_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: rengine-db-1
    entrypoint: /entrypoint.sh
    volumes:
      - ./postgres/entrypoint.sh:/entrypoint.sh:ro
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rengine -d rengine"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - rengine_network

  redis:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-redis-v${RENGINE_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: rengine-redis-1
    hostname: redis
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rengine_network

  worker:
    image: freelabz/secator:latest
    container_name: secator-worker
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    command: ['worker']
    env_file:
      - ../.env
    volumes:
      - scan_results:/home/secator/.secator/reports
      - ./worker/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - redis
    networks:
      - rengine_network
    # =========================================================================
    # Remote Worker Deployment
    # =========================================================================
    # For deploying workers on remote machines (VPS, internal networks, etc.),
    # use docker-compose.worker.yml with a configured .env file.
    #
    # Quick setup on remote machine:
    #   1. Copy docker-compose.worker.yml and .env-dist.worker
    #   2. Rename .env-dist.worker to .env
    #   3. Configure Redis and API URLs in .env
    #   4. Run: docker-compose -f docker-compose.worker.yml up -d
    #
    # See docker-compose.worker.yml and .env-dist.worker for full documentation.
    # =========================================================================

  web:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-web-v${RENGINE_VERSION}
    env_file:
      - ../.env
    user: rengine
    restart: unless-stopped
    container_name: rengine-web-1
    entrypoint: /entrypoint.sh
    environment:
      - RENGINE_HOME=/home/rengine/rengine
      - UI_ERROR_LOGGING=0
    volumes:
      - ../web:/home/rengine/rengine:rw,z
      - ./web/entrypoint.sh:/entrypoint.sh:ro
      - nuclei_templates:/home/rengine/nuclei-templates
      - wordlist:/home/rengine/wordlists
      - scan_results:/home/rengine/scan_results
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "http://localhost:8000"]
      interval: 10s
      timeout: 10s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      rengine_network:
        aliases:
          - rengine

  proxy:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-proxy-v${RENGINE_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: rengine-proxy-1
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: proxy.ca
        target: /etc/nginx/certs/rengine_chain.pem
      - source: proxy.cert
        target: /etc/nginx/certs/rengine.pem
      - source: proxy.key
        target: /etc/nginx/certs/rengine_rsa.key
    volumes:
      - ./proxy/config/rengine.conf:/etc/nginx/conf.d/rengine.conf:ro
      - ../web:/home/rengine/rengine:rw,z
      - scan_results:/home/rengine/scan_results
    networks:
      - rengine_network
    ports:
      - 8082:8082/tcp
      - 443:443/tcp

  ollama:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-ollama-v${RENGINE_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: rengine-ollama-1
    volumes:
      - ollama_data:/home/rengine/.ollama:rw,z
    networks:
      - rengine_network

networks:
  rengine_network:
    name: rengine_network

volumes:
  postgres_data:
    name: rengine_postgres_data
  nuclei_templates:
    name: rengine_nuclei_templates
  wordlist:
    name: rengine_wordlist
  scan_results:
    name: rengine_scan_results
  ollama_data:
    name: rengine_ollama_data


secrets:
  proxy.ca:
    file: ./secrets/certs/rengine_chain.pem
  proxy.key:
    file: ./secrets/certs/rengine_rsa.key
  proxy.cert:
    file: ./secrets/certs/rengine.pem
