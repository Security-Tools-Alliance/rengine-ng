name: rengine

services:
  db:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-postgres-v${RENGINE_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: rengine-db-1
    entrypoint: /entrypoint.sh
    volumes:
      - ./postgres/entrypoint.sh:/entrypoint.sh:ro
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rengine -d rengine"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - rengine_network

  pgbouncer:
    build: ./pgbouncer
    image: edoburu/pgbouncer:latest
    container_name: rengine-pgbouncer-1
    env_file:
      - ../.env
    environment:
      - AUTH_TYPE=scram-sha-256
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - LISTEN_ADDR=0.0.0.0
      - LISTEN_PORT=${PGBOUNCER_LISTEN_PORT:-6432}
      - POOL_MODE=${PGBOUNCER_POOL_MODE:-transaction}
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-200}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-30}
      - SERVER_RESET_QUERY=${PGBOUNCER_SERVER_RESET_QUERY:-DISCARD ALL}
    command: ["/bin/sh", "-c", "sed -i \"s/^user = postgres/user = $$POSTGRES_USER/\" /etc/pgbouncer/pgbouncer.ini; exec pgbouncer /etc/pgbouncer/pgbouncer.ini"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rengine_network

  redis:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-redis-v${RENGINE_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: rengine-redis-1
    hostname: redis
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rengine_network

  worker:
    image: freelabz/secator:latest
    container_name: secator-worker
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    command: ['worker']
    env_file:
      - ../.env
    environment:
      - PYTHONWARNINGS=ignore::urllib3.exceptions.InsecureRequestWarning
    volumes:
      - scan_results:/home/secator/.secator/reports
      - nuclei_templates:/home/secator/nuclei-templates
      - wordlist:/home/secator/.secator/wordlists
      - gf_patterns:/home/secator/.gf
      - ./worker/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - redis
    networks:
      - rengine_network

  web:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-web-v${RENGINE_VERSION}
    env_file:
      - ../.env
    user: rengine
    restart: unless-stopped
    container_name: rengine-web-1
    entrypoint: /entrypoint.sh
    environment:
      - RENGINE_HOME=/home/rengine/rengine
      - UI_ERROR_LOGGING=0
    volumes:
      - ../web:/home/rengine/rengine:rw,z
      - ./web/entrypoint.sh:/entrypoint.sh:ro
      - ./docker-compose.worker.yml:/home/rengine/docker/docker-compose.worker.yml:ro
      - ./worker/entrypoint.sh:/home/rengine/docker/entrypoint.sh:ro
      - rengine_ssh_keys:/home/rengine/.ssh
      - nuclei_templates:/home/rengine/nuclei-templates
      - wordlist:/home/rengine/wordlists
      - gf_patterns:/home/rengine/.gf
      - scan_results:/home/rengine/scan_results
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "http://localhost:8000"]
      interval: 10s
      timeout: 10s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      worker:
        condition: service_started
    networks:
      rengine_network:
        aliases:
          - rengine

  proxy:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-proxy-v${RENGINE_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: rengine-proxy-1
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: proxy.ca
        target: /etc/nginx/certs/rengine_chain.pem
      - source: proxy.cert
        target: /etc/nginx/certs/rengine.pem
      - source: proxy.key
        target: /etc/nginx/certs/rengine_rsa.key
    volumes:
      - ./proxy/config/rengine.conf:/etc/nginx/conf.d/rengine.conf:ro
      - ../web:/home/rengine/rengine:rw,z
      - scan_results:/home/rengine/scan_results
    networks:
      - rengine_network
    ports:
      - 8082:8082/tcp
      - 443:443/tcp

  ollama:
    image: ghcr.io/security-tools-alliance/rengine-ng:rengine-ollama-v${RENGINE_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: rengine-ollama-1
    volumes:
      - ollama_data:/home/rengine/.ollama:rw,z
    networks:
      - rengine_network

networks:
  rengine_network:
    name: rengine_network

volumes:
  postgres_data:
    name: rengine_postgres_data
  gf_patterns:
    name: rengine_gf_patterns
  nuclei_templates:
    name: rengine_nuclei_templates
  wordlist:
    name: rengine_wordlist
  scan_results:
    name: rengine_scan_results
  ollama_data:
    name: rengine_ollama_data
  rengine_ssh_keys:
    name: rengine_ssh_keys


secrets:
  proxy.ca:
    file: ./secrets/certs/rengine_chain.pem
  proxy.key:
    file: ./secrets/certs/rengine_rsa.key
  proxy.cert:
    file: ./secrets/certs/rengine.pem
