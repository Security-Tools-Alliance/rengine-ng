services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  worker:
    entrypoint: /entrypoint-dev.sh
    environment:
      - SECATOR_DEBUG=runner,hooks
    volumes:
      - ./worker/entrypoint-dev.sh:/entrypoint-dev.sh:ro
    # args:
      # - --concurrency=3
      # - --dev
      # - --reload
      # - --without-gossip
      # - --without-mingle
      # - --without-heartbeat
      # - --quiet
  web:
    entrypoint: /entrypoint-dev.sh
    environment:
      - UI_DEBUG=1
      - SECATOR_API_DEBUG=1
      # Remote debugger (debugpy): bind host defaults to 127.0.0.1; set RENGINE_DEBUG_HOST=0.0.0.0 for remote attach (see docs/DEBUGGING.md).
      - UI_REMOTE_DEBUG=1
      - UI_REMOTE_DEBUG_PORT=5678
    volumes:
      - ./web/entrypoint-dev.sh:/entrypoint-dev.sh:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5678:5678"

  ollama:
    ports:
      - "127.0.0.1:11434:11434"
