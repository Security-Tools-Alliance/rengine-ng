services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  celery:
    entrypoint: /entrypoint-dev.sh
    environment:
      - CELERY_DEBUG=1
      - CELERY_REMOTE_DEBUG=0
      - CELERY_REMOTE_DEBUG_PORT=5679
      - SECATOR_CONCURRENCY=3
      - SECATOR_DEV_MODE=0
      - SECATOR_LOG_LEVEL=debug
      - SECATOR_PREFETCH_MULTIPLIER=4
      - SECATOR_QUIET=0
      - SECATOR_USE_CUSTOM_RELOAD=1
      - SECATOR_WITHOUT_GOSSIP=1
      - SECATOR_WITHOUT_MINGLE=1
      - SECATOR_WITHOUT_HEARTBEAT=1
      - FLOWER_UNAUTHENTICATED_API=1
    volumes:
      - ./celery/entrypoint-dev.sh:/entrypoint-dev.sh:ro
      - ./celery/smart_reload.py:/home/rengine/smart_reload.py:ro
    ports:
      - "127.0.0.1:5679:5679"
      - "127.0.0.1:5555:5555"

  celery-beat:
    entrypoint: /entrypoint-dev.sh
    environment:
      - CELERY_DEBUG=1
    volumes:
      - ./beat/entrypoint-dev.sh:/entrypoint-dev.sh:ro

  web:
    entrypoint: /entrypoint-dev.sh
    environment:
      - UI_DEBUG=1
      - UI_REMOTE_DEBUG=0
      - UI_REMOTE_DEBUG_PORT=5678
    volumes:
      - ./web/entrypoint-dev.sh:/entrypoint-dev.sh:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5678:5678"

  ollama:
    ports:
      - "127.0.0.1:11434:11434"
