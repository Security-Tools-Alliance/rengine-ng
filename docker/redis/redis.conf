# Explicit config file (removes "no config file specified" warning)
bind 0.0.0.0
port 6379
protected-mode no

# Persistence: one RDB save point (set save "" to disable entirely)
save 900 1

# Memory limit and eviction
maxmemory 2gb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Idle client timeout (seconds)
timeout 300

# TCP keepalive
tcp-keepalive 60
