name: Lint (Ruff) and Autofix

on:
  push:
  pull_request:

jobs:
  lint:
    name: Ruff lint (no changes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Ruff version from pyproject
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = Path("docker/web/pyproject.toml")
          data = tomllib.loads(pyproject.read_text(encoding="utf-8"))

          dep = (
              data.get("tool", {})
              .get("poetry", {})
              .get("group", {})
              .get("dev", {})
              .get("dependencies", {})
              .get("ruff")
          )

          if dep is None:
              raise SystemExit("ruff dependency not found in docker/web/pyproject.toml")

          if isinstance(dep, str):
              version = dep
          elif isinstance(dep, dict) and "version" in dep:
              version = dep["version"]
          else:
              raise SystemExit(f"Unsupported ruff dependency format: {dep!r}")

          version = version.lstrip("^~>=<")
          print(f"RUFF_VERSION={version}")
          with Path("/tmp/github_env_ruff").open("w", encoding="utf-8") as f:
              f.write(f"RUFF_VERSION={version}\n")
          PY
          cat /tmp/github_env_ruff >> "$GITHUB_ENV"

      - name: Install Ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Ruff format (check only)
        run: ruff format --config docker/web/pyproject.toml --check .

      - name: Ruff check (no fix)
        run: ruff check --config docker/web/pyproject.toml .

  autofix:
    name: Ruff autofix (push only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Ruff version from pyproject
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = Path("docker/web/pyproject.toml")
          data = tomllib.loads(pyproject.read_text(encoding="utf-8"))

          dep = (
              data.get("tool", {})
              .get("poetry", {})
              .get("group", {})
              .get("dev", {})
              .get("dependencies", {})
              .get("ruff")
          )

          if dep is None:
              raise SystemExit("ruff dependency not found in docker/web/pyproject.toml")

          if isinstance(dep, str):
              version = dep
          elif isinstance(dep, dict) and "version" in dep:
              version = dep["version"]
          else:
              raise SystemExit(f"Unsupported ruff dependency format: {dep!r}")

          version = version.lstrip("^~>=<")
          print(f"RUFF_VERSION={version}")
          with Path("/tmp/github_env_ruff").open("w", encoding="utf-8") as f:
              f.write(f"RUFF_VERSION={version}\n")
          PY
          cat /tmp/github_env_ruff >> "$GITHUB_ENV"

      - name: Install Ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Apply Ruff formatting
        run: ruff format --config docker/web/pyproject.toml .

      - name: Apply Ruff fixes
        run: ruff check --fix --config docker/web/pyproject.toml .

      - name: Commit fixes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(ruff): auto-format and auto-fix via CI"
          add_options: "-A"
