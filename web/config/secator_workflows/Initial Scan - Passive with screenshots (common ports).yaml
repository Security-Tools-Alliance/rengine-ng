type: workflow
name: Initial Scan - Passive with screenshots (common ports)
description: 'Converted from reNgine scan engine: Initial Scan - Passive with screenshots
  (common ports)'
tags:
- bug_bounty
input_types:
- domain
tasks:
  subfinder:
    description: Subdomain discovery
    rate_limit: 30
    timeout: 5
    additional_tools:
    - ctfr
    - sublist3r
    - tlsx
    - oneforall
    - netlas
  httpx:
    description: HTTP probing and crawling
    rate_limit: 30
    timeout: 10
    targets_:
    - type: port
      field: host:port
      condition: item.port in [80, 443, 8080, 8081, 8082, 8443, 3000, 3001, 5000,
        9000]
  aquatone:
    description: Screenshot capture
    timeout: 10
    targets_:
    - type: url
      field: url
      condition: item.status_code == 200
  osint:
    description: OSINT gathering
    intensity: normal
    targets_:
    - type: domain
      field: domain
  waf_detection:
    description: WAF detection
    targets_:
    - type: url
      field: url
      condition: item.status_code == 200
global_options:
  custom_header:
    User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:126.0) Gecko/20100101 Firefox/126.0
metadata:
  scan_type: bug_bounty
  converted_from: rengine
