name: internet_passive
description: Passive reconnaissance workflow for bug bounty programs
scan_type: internet
workflow_type: custom

tasks:
  - name: subdomain_discovery
    type: subfinder
    config:
      silent: true
      threads: 10
      
  - name: dns_resolution
    type: dnsx
    config:
      silent: true
      threads: 10
      
  - name: url_discovery
    type: gau
    config:
      silent: true
      threads: 5
      
  - name: http_probe
    type: httpx
    config:
      silent: true
      threads: 20
      follow_redirects: true
