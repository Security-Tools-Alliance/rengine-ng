type: workflow
name: bug_bounty_passive
alias: bbpassive
description: Passive bug bounty reconnaissance
long_description: |
  Comprehensive passive reconnaissance workflow for bug bounty programs.
  Uses only passive techniques to discover subdomains, URLs, and gather
  information without making direct requests to targets. Analyzes historical
  data, DNS records, WHOIS information, and passive URL sources. Optionally
  performs minimal verification probes and secret hunting.
tags: [recon, bugbounty, passive]
input_types:
  - host

options:
  verify:
    is_flag: True
    default: False
    help: Perform minimal HTTP verification probes
    short: v

  hunt_secrets:
    is_flag: True
    default: False
    help: Hunt secrets in HTTP responses (trufflehog)
    short: hs

tasks:
  _group/passive_discover:
    subfinder:
      description: Discover subdomains (passive)

    dnsx:
      description: Resolve DNS records

    xurlfind3r:
      description: Discover URLs from passive sources

    urlfinder:
      description: Find URLs in text

    gau:
      description: Fetch known URLs from passive sources

  jswhois:
    description: Get WHOIS information
    targets_:
      - type: target
        field: name

  getasn:
    description: Get ASN information
    targets_:
      - type: target
        field: name

  urlparser:
    description: Extract query string parameters from URLs
    include: [url_base]
    targets_:
      - type: url
        field: url

  urlfinder/analyze:
    description: Find URLs in discovered content
    targets_:
      - type: url
        field: url

  _group/pattern:
    gf/xss:
      description: Hunt XSS params (passive analysis)
      pattern: xss
      targets_:
        - type: url
          field: url

    gf/lfi:
      description: Hunt LFI params (passive analysis)
      pattern: lfi
      targets_:
        - type: url
          field: url

    gf/ssrf:
      description: Hunt SSRF params (passive analysis)
      pattern: ssrf
      targets_:
        - type: url
          field: url

  httpx:
    description: Run HTTP probes on discovered URLs
    tech_detect: True
    filter_duplicates: True
    targets_:
      - type: url
        field: url
    if: opts.verify

  trufflehog:
    description: Find secrets in HTTP responses
    targets_:
      - type: url
        field: stored_response_path
        condition: 'item.stored_response_path != ""'
    if: opts.hunt_secrets and opts.verify
