<!-- Secator Profiles Selection - Reusable component -->
{# Params: id_prefix (string, optional) #}
<div class="profile-selector">
  <!-- Speed Profile -->
  <div class="profile-category-container mb-3">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="{{ id_prefix|default:'' }}useSpeedProfile" name="use_speed_profile">
      <label class="form-check-label" for="{{ id_prefix|default:'' }}useSpeedProfile">Use Speed Profile</label>
    </div>
    <div class="profile-category-section" data-profile-category="speed" style="display: none;">
      <h6 class="mt-2">Speed Profile</h6>
      <p class="small text-muted mb-2">Controls scan speed and intensity</p>
      <div class="btn-group" id="{{ id_prefix|default:'' }}speed-builtin-buttons">
    <button type="button" class="btn btn-outline-primary{% if default_profiles.speed == 'aggressive' %} active btn-primary{% endif %}" data-profile-type="speed" data-profile-value="aggressive" data-bs-toggle="tooltip" title="Optimized for internal networks or time-sensitive scans with no rate limiting">
      ⚡ Aggressive{% if default_profiles.speed == 'aggressive' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-primary{% if default_profiles.speed == 'insane' %} active btn-primary{% endif %}" data-profile-type="speed" data-profile-value="insane" data-bs-toggle="tooltip" title="Maximum speed for local LAN scanning or stress testing">
      🔥 Insane{% if default_profiles.speed == 'insane' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-primary{% if default_profiles.speed == 'polite' %} active btn-primary{% endif %}" data-profile-type="speed" data-profile-value="polite" data-bs-toggle="tooltip" title="Balanced settings to avoid overloading the network">
      🤝 Polite{% if default_profiles.speed == 'polite' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-primary{% if default_profiles.speed == 'paranoid' %} active btn-primary{% endif %}" data-profile-type="speed" data-profile-value="paranoid" data-bs-toggle="tooltip" title="Maximum stealth with very conservative settings">
      🛡️ Paranoid{% if default_profiles.speed == 'paranoid' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
  </div>
  <div class="mt-2">
    <select class="form-control" id="{{ id_prefix|default:'' }}speed_custom_profile" name="speed_custom_profile" style="display: none;">
      <option value="">-- Select Custom Profile --</option>
      {% for profile in custom_profiles_by_category.speed %}
      <option value="{{ profile.name }}" data-description="{{ profile.description }}" {% if default_profiles.speed == profile.name %}selected{% endif %}>{{ profile.name }}</option>
      {% endfor %}
    </select>
      <div id="{{ id_prefix|default:'' }}speed_custom_description" class="small text-muted mt-1" style="display: none;"></div>
    </div>
  </div>
  
  <!-- Evasion Profile -->
  <div class="profile-category-container mb-3">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="{{ id_prefix|default:'' }}useEvasionProfile" name="use_evasion_profile">
      <label class="form-check-label" for="{{ id_prefix|default:'' }}useEvasionProfile">Use Evasion Profile</label>
    </div>
    <div class="profile-category-section" data-profile-category="evasion" style="display: none;">
      <h6 class="mt-2">Evasion Profile</h6>
      <p class="small text-muted mb-2">Configures evasion techniques to avoid detection</p>
      <div class="btn-group" id="{{ id_prefix|default:'' }}evasion-builtin-buttons">
    <button type="button" class="btn btn-outline-secondary{% if default_profiles.evasion == 'sneaky' %} active btn-secondary{% endif %}" data-profile-type="evasion" data-profile-value="sneaky" data-bs-toggle="tooltip" title="IDS/IPS evasion for sensitive networks using packet fragmentation">
      🥷 Sneaky{% if default_profiles.evasion == 'sneaky' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-secondary{% if default_profiles.evasion == 'stealth' %} active btn-secondary{% endif %}" data-profile-type="evasion" data-profile-value="stealth" data-bs-toggle="tooltip" title="Stealth scan using TCP SYN scanning">
      🦎 Stealth{% if default_profiles.evasion == 'stealth' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-secondary{% if default_profiles.evasion == 'tor' %} active btn-secondary{% endif %}" data-profile-type="evasion" data-profile-value="tor" data-bs-toggle="tooltip" title="Anonymous scanning using the Tor network">
      🧅 Tor{% if default_profiles.evasion == 'tor' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
  </div>
  <div class="mt-2">
    <select class="form-control" id="{{ id_prefix|default:'' }}evasion_custom_profile" name="evasion_custom_profile" style="display: none;">
      <option value="">-- Select Custom Profile --</option>
      {% for profile in custom_profiles_by_category.evasion %}
      <option value="{{ profile.name }}" data-description="{{ profile.description }}" {% if default_profiles.evasion == profile.name %}selected{% endif %}>{{ profile.name }}</option>
      {% endfor %}
    </select>
      <div id="{{ id_prefix|default:'' }}evasion_custom_description" class="small text-muted mt-1" style="display: none;"></div>
    </div>
  </div>
  
  <!-- General Profile -->
  <div class="profile-category-container mb-3">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="{{ id_prefix|default:'' }}useGeneralProfile" name="use_general_profile">
      <label class="form-check-label" for="{{ id_prefix|default:'' }}useGeneralProfile">Use General Profile</label>
    </div>
    <div class="profile-category-section" data-profile-category="general" style="display: none;">
      <h6 class="mt-2">General Profile</h6>
      <p class="small text-muted mb-2">Controls global scan approach and feature activation</p>
      <div class="btn-group" id="{{ id_prefix|default:'' }}general-builtin-buttons">
    <button type="button" class="btn btn-outline-info{% if default_profiles.general == 'active' %} active btn-info{% endif %}" data-profile-type="general" data-profile-value="active" data-bs-toggle="tooltip" title="Active scanning only (no passive sources used)">
      🎯 Active{% if default_profiles.general == 'active' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-info{% if default_profiles.general == 'passive' %} active btn-info{% endif %}" data-profile-type="general" data-profile-value="passive" data-bs-toggle="tooltip" title="Passive scanning only (no requests to targets)">
      👁️ Passive{% if default_profiles.general == 'passive' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-info{% if default_profiles.general == 'full' %} active btn-info{% endif %}" data-profile-type="general" data-profile-value="full" data-bs-toggle="tooltip" title="Activate all optional features">
      ⚡ Full{% if default_profiles.general == 'full' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
  </div>
  <div class="mt-2">
    <select class="form-control" id="{{ id_prefix|default:'' }}general_custom_profile" name="general_custom_profile" style="display: none;">
      <option value="">-- Select Custom Profile --</option>
      {% for profile in custom_profiles_by_category.general %}
      <option value="{{ profile.name }}" data-description="{{ profile.description }}" {% if default_profiles.general == profile.name %}selected{% endif %}>{{ profile.name }}</option>
      {% endfor %}
    </select>
      <div id="{{ id_prefix|default:'' }}general_custom_description" class="small text-muted mt-1" style="display: none;"></div>
    </div>
  </div>
  
  <!-- Network Profile -->
  <div class="profile-category-container mb-3">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="{{ id_prefix|default:'' }}useNetworkProfile" name="use_network_profile">
      <label class="form-check-label" for="{{ id_prefix|default:'' }}useNetworkProfile">Use Network Profile</label>
    </div>
    <div class="profile-category-section" data-profile-category="network" style="display: none;">
      <h6 class="mt-2">Network Profile</h6>
      <p class="small text-muted mb-2">Configures network-specific options for the scan</p>
      <div class="btn-group" id="{{ id_prefix|default:'' }}network-builtin-buttons">
    <button type="button" class="btn btn-outline-success{% if default_profiles.network == 'all_ports' %} active btn-success{% endif %}" data-profile-type="network" data-profile-value="all_ports" data-bs-toggle="tooltip" title="Scan all ports instead of common ports">
      🔌 All Ports{% if default_profiles.network == 'all_ports' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-success{% if default_profiles.network == 'http_headless' %} active btn-success{% endif %}" data-profile-type="network" data-profile-value="http_headless" data-bs-toggle="tooltip" title="Headless HTTP requests - Enables headless browser mode for HTTP tasks">
      🤖 HTTP Headless{% if default_profiles.network == 'http_headless' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
    <button type="button" class="btn btn-outline-success{% if default_profiles.network == 'http_record' %} active btn-success{% endif %}" data-profile-type="network" data-profile-value="http_record" data-bs-toggle="tooltip" title="Record HTTP requests / responses and take screenshots">
      🎬 HTTP Record{% if default_profiles.network == 'http_record' %} <small class="ms-1">(Default)</small>{% endif %}
    </button>
  </div>
  <div class="mt-2">
    <select class="form-control" id="{{ id_prefix|default:'' }}network_custom_profile" name="network_custom_profile" style="display: none;">
      <option value="">-- Select Custom Profile --</option>
      {% for profile in custom_profiles_by_category.network %}
      <option value="{{ profile.name }}" data-description="{{ profile.description }}" {% if default_profiles.network == profile.name %}selected{% endif %}>{{ profile.name }}</option>
      {% endfor %}
    </select>
      <div id="{{ id_prefix|default:'' }}network_custom_description" class="small text-muted mt-1" style="display: none;"></div>
    </div>
  </div>
</div>

<script>
// Profile selection exclusive logic
document.addEventListener('DOMContentLoaded', function() {
  const categories = ['speed', 'evasion', 'general', 'network'];
  const idPrefix = '{{ id_prefix|default:"" }}';
  
  // Map category to appropriate Bootstrap button class
  const categoryToButtonClass = {
    'speed': 'btn-primary',
    'evasion': 'btn-secondary',
    'general': 'btn-info',
    'network': 'btn-success'
  };
  
  // Map solid classes to outline classes
  const solidToOutlineMap = {
    'btn-primary': 'btn-outline-primary',
    'btn-secondary': 'btn-outline-secondary',
    'btn-info': 'btn-outline-info',
    'btn-success': 'btn-outline-success'
  };
  
  // Helper function to reset button classes based on category
  function resetButtonClasses(button, category) {
    // Remove active state and all solid/outline contextual classes
    button.classList.remove('active');
    
    // Remove all known solid/outline contextual classes
    Object.keys(solidToOutlineMap).forEach(solidClass => {
      button.classList.remove(solidClass);
      button.classList.remove(solidToOutlineMap[solidClass]);
    });
    
    // Apply the appropriate outline class based on category
    const outlineClass = solidToOutlineMap[categoryToButtonClass[category]];
    if (outlineClass) {
      button.classList.add(outlineClass);
    }
  }
  
  // Get default profiles from template context (passed from backend)
  const defaultProfiles = {
    'speed': '{{ default_profiles.speed|default:"polite" }}',
    'evasion': '{{ default_profiles.evasion|default:"stealth" }}',
    'general': '{{ default_profiles.general|default:"full" }}',
    'network': '{{ default_profiles.network|default:"all_ports" }}'
  };
  
  document.querySelectorAll('.profile-selector').forEach(profileRoot => {
    const form = profileRoot.closest('form') || document;

    categories.forEach(category => {
      const builtinButtonsId = idPrefix + category + '-builtin-buttons';
      const customSelectId = idPrefix + category + '_custom_profile';
      const descriptionDivId = idPrefix + category + '_custom_description';
      const builtinButtons = profileRoot.querySelector('#' + builtinButtonsId);
      const customSelect = profileRoot.querySelector('#' + customSelectId);
      const descriptionDiv = profileRoot.querySelector('#' + descriptionDivId);
      const hiddenInputName = category === 'evasion' ? 'stealth_profile' : category + '_profile';
      const hiddenInput = form.querySelector(`input[name="${hiddenInputName}"]`);
    
      // Handle builtin button clicks
      if (builtinButtons) {
        builtinButtons.querySelectorAll('button').forEach(button => {
          button.addEventListener('click', function() {
            // Deselect all buttons in this category
            builtinButtons.querySelectorAll('button').forEach(btn => {
              resetButtonClasses(btn, category);
            });
            
            // Select clicked button
            resetButtonClasses(this, category);
            const solidClass = categoryToButtonClass[category];
            if (solidClass) {
              this.classList.add(solidClass, 'active');
            }
            
            // Reset custom select value but keep it visible if there are custom profiles
            if (customSelect) {
              customSelect.value = '';
              // Keep select visible if there are custom profiles available
              if (customSelect.options.length > 1) {
                customSelect.style.display = 'block';
              }
            }
            if (descriptionDiv) {
              descriptionDiv.style.display = 'none';
              descriptionDiv.textContent = '';
            }
            
            // Update hidden input
            if (hiddenInput) {
              hiddenInput.value = this.dataset.profileValue;
            }
          });
        });
      }
      
      // Handle custom select changes
      if (customSelect) {
        customSelect.addEventListener('change', function() {
          const selectedOption = this.options[this.selectedIndex];
          
          if (this.value) {
            // Deselect all builtin buttons
            if (builtinButtons) {
              builtinButtons.querySelectorAll('button').forEach(btn => {
                resetButtonClasses(btn, category);
              });
            }
            
            // Show description
            if (descriptionDiv && selectedOption.dataset.description) {
              descriptionDiv.textContent = selectedOption.dataset.description;
              descriptionDiv.style.display = 'block';
            }
            
            // Update hidden input with custom profile name
            if (hiddenInput) {
              hiddenInput.value = this.value;
            }
          } else {
            // Reset to default
            if (descriptionDiv) {
              descriptionDiv.style.display = 'none';
              descriptionDiv.textContent = '';
            }
            if (hiddenInput) {
              hiddenInput.value = '';
            }
          }
        });
      }
      
      // Show custom select if there are custom profiles
      // Always show the select if there are custom profiles available (options.length > 1 means there's at least one custom profile)
      if (customSelect && customSelect.options.length > 1) {
        customSelect.style.display = 'block';
      }
      
      // Initialize default profile value
      const defaultProfile = defaultProfiles[category];
      if (defaultProfile && hiddenInput) {
        // Check if default profile is a custom profile
        const isCustomDefault = customSelect && Array.from(customSelect.options).some(opt => opt.value === defaultProfile);
        
        if (isCustomDefault) {
          // Default is a custom profile - select it in dropdown
          customSelect.value = defaultProfile;
          // Update hidden input
          hiddenInput.value = defaultProfile;
          // Show description
          const selectedOption = customSelect.options[customSelect.selectedIndex];
          if (descriptionDiv && selectedOption && selectedOption.dataset.description) {
            descriptionDiv.textContent = selectedOption.dataset.description;
            descriptionDiv.style.display = 'block';
          }
          // Deselect all builtin buttons
          if (builtinButtons) {
            builtinButtons.querySelectorAll('button').forEach(btn => {
              resetButtonClasses(btn, category);
            });
          }
        } else {
          // Default is a builtin profile
          if (builtinButtons) {
            const defaultButton = builtinButtons.querySelector(`[data-profile-value="${defaultProfile}"]`);
            if (defaultButton) {
              // Button is already marked as active in template, just set hidden input
              hiddenInput.value = defaultProfile;
            }
          } else {
            // If no builtin buttons, set default value anyway
            hiddenInput.value = defaultProfile;
          }
        }
      }
    });
  });
});
</script>
