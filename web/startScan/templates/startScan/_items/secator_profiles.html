<!-- Secator Profiles Selection - Reusable component -->
<div class="profile-selector">
  <!-- Speed Profile -->
  <h6>Speed Profile</h6>
  <p class="small text-muted mb-2">Controls scan speed and intensity</p>
  <div class="btn-group" id="speed-builtin-buttons">
    <button class="btn btn-outline-primary" data-profile-type="speed" data-profile-value="aggressive" data-bs-toggle="tooltip" title="Optimized for internal networks or time-sensitive scans with no rate limiting">
      ⚡ Aggressive
    </button>
    <button class="btn btn-outline-primary" data-profile-type="speed" data-profile-value="insane" data-bs-toggle="tooltip" title="Maximum speed for local LAN scanning or stress testing">
      🔥 Insane
    </button>
    <button class="btn btn-primary active" data-profile-type="speed" data-profile-value="polite" data-bs-toggle="tooltip" title="Balanced settings to avoid overloading the network">
      🤝 Polite <small class="ms-1">(Default)</small>
    </button>
    <button class="btn btn-outline-primary" data-profile-type="speed" data-profile-value="paranoid" data-bs-toggle="tooltip" title="Maximum stealth with very conservative settings">
      🛡️ Paranoid
    </button>
  </div>
  <div class="mt-2">
    <select class="form-control" id="speed_custom_profile" name="speed_custom_profile" style="display: none;">
      <option value="">-- Select Custom Profile --</option>
      {% for profile in custom_profiles_by_category.speed %}
      <option value="{{ profile.name }}" data-description="{{ profile.description }}">{{ profile.name }}</option>
      {% endfor %}
    </select>
    <div id="speed_custom_description" class="small text-muted mt-1" style="display: none;"></div>
  </div>
  
  <!-- Evasion Profile -->
  <h6 class="mt-3">Evasion Profile</h6>
  <p class="small text-muted mb-2">Configures evasion techniques to avoid detection</p>
  <div class="btn-group" id="evasion-builtin-buttons">
    <button class="btn btn-outline-secondary" data-profile-type="evasion" data-profile-value="sneaky" data-bs-toggle="tooltip" title="IDS/IPS evasion for sensitive networks using packet fragmentation">
      🥷 Sneaky
    </button>
    <button class="btn btn-secondary active" data-profile-type="evasion" data-profile-value="stealth" data-bs-toggle="tooltip" title="Stealth scan using TCP SYN scanning">
      🦎 Stealth <small class="ms-1">(Default)</small>
    </button>
    <button class="btn btn-outline-secondary" data-profile-type="evasion" data-profile-value="tor" data-bs-toggle="tooltip" title="Anonymous scanning using the Tor network">
      🧅 Tor
    </button>
  </div>
  <div class="mt-2">
    <select class="form-control" id="evasion_custom_profile" name="evasion_custom_profile" style="display: none;">
      <option value="">-- Select Custom Profile --</option>
      {% for profile in custom_profiles_by_category.evasion %}
      <option value="{{ profile.name }}" data-description="{{ profile.description }}">{{ profile.name }}</option>
      {% endfor %}
    </select>
    <div id="evasion_custom_description" class="small text-muted mt-1" style="display: none;"></div>
  </div>
  
  <!-- General Profile -->
  <h6 class="mt-3">General Profile</h6>
  <p class="small text-muted mb-2">Controls global scan approach and feature activation</p>
  <div class="btn-group" id="general-builtin-buttons">
    <button class="btn btn-outline-info" data-profile-type="general" data-profile-value="active" data-bs-toggle="tooltip" title="Active scanning only (no passive sources used)">
      🎯 Active
    </button>
    <button class="btn btn-outline-info" data-profile-type="general" data-profile-value="passive" data-bs-toggle="tooltip" title="Passive scanning only (no requests to targets)">
      👁️ Passive
    </button>
    <button class="btn btn-info active" data-profile-type="general" data-profile-value="full" data-bs-toggle="tooltip" title="Activate all optional features">
      ⚡ Full <small class="ms-1">(Default)</small>
    </button>
  </div>
  <div class="mt-2">
    <select class="form-control" id="general_custom_profile" name="general_custom_profile" style="display: none;">
      <option value="">-- Select Custom Profile --</option>
      {% for profile in custom_profiles_by_category.general %}
      <option value="{{ profile.name }}" data-description="{{ profile.description }}">{{ profile.name }}</option>
      {% endfor %}
    </select>
    <div id="general_custom_description" class="small text-muted mt-1" style="display: none;"></div>
  </div>
  
  <!-- Network Profile -->
  <h6 class="mt-3">Network Profile</h6>
  <p class="small text-muted mb-2">Configures network-specific options for the scan</p>
  <div class="btn-group" id="network-builtin-buttons">
    <button class="btn btn-success active" data-profile-type="network" data-profile-value="all_ports" data-bs-toggle="tooltip" title="Scan all ports instead of common ports">
      🔌 All Ports <small class="ms-1">(Default)</small>
    </button>
    <button class="btn btn-outline-success" data-profile-type="network" data-profile-value="http_headless" data-bs-toggle="tooltip" title="Headless HTTP requests - Enables headless browser mode for HTTP tasks">
      🤖 HTTP Headless
    </button>
    <button class="btn btn-outline-success" data-profile-type="network" data-profile-value="http_record" data-bs-toggle="tooltip" title="Record HTTP requests / responses and take screenshots">
      🎬 HTTP Record
    </button>
  </div>
  <div class="mt-2">
    <select class="form-control" id="network_custom_profile" name="network_custom_profile" style="display: none;">
      <option value="">-- Select Custom Profile --</option>
      {% for profile in custom_profiles_by_category.network %}
      <option value="{{ profile.name }}" data-description="{{ profile.description }}">{{ profile.name }}</option>
      {% endfor %}
    </select>
    <div id="network_custom_description" class="small text-muted mt-1" style="display: none;"></div>
  </div>
</div>

<script>
// Profile selection exclusive logic
document.addEventListener('DOMContentLoaded', function() {
  const categories = ['speed', 'evasion', 'general', 'network'];
  
  // Initialize default values for builtin profiles
  const defaultProfiles = {
    'speed': 'polite',
    'evasion': 'stealth',
    'general': 'full',
    'network': 'all_ports'
  };
  
  categories.forEach(category => {
    const builtinButtons = document.getElementById(category + '-builtin-buttons');
    const customSelect = document.getElementById(category + '_custom_profile');
    const descriptionDiv = document.getElementById(category + '_custom_description');
    const hiddenInput = document.getElementById(category === 'evasion' ? 'stealth_profile' : category + '_profile');
    
    // Handle builtin button clicks
    if (builtinButtons) {
      builtinButtons.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', function() {
          // Deselect all buttons in this category
          builtinButtons.querySelectorAll('button').forEach(btn => {
            btn.classList.remove('active', 'btn-primary', 'btn-secondary', 'btn-info', 'btn-success');
            btn.classList.add('btn-outline-primary', 'btn-outline-secondary', 'btn-outline-info', 'btn-outline-success');
          });
          
          // Select clicked button
          this.classList.remove('btn-outline-primary', 'btn-outline-secondary', 'btn-outline-info', 'btn-outline-success');
          if (category === 'speed') {
            this.classList.add('btn-primary', 'active');
          } else if (category === 'evasion') {
            this.classList.add('btn-secondary', 'active');
          } else if (category === 'general') {
            this.classList.add('btn-info', 'active');
          } else if (category === 'network') {
            this.classList.add('btn-success', 'active');
          }
          
          // Hide and reset custom select
          if (customSelect) {
            customSelect.style.display = 'none';
            customSelect.value = '';
          }
          if (descriptionDiv) {
            descriptionDiv.style.display = 'none';
            descriptionDiv.textContent = '';
          }
          
          // Update hidden input
          if (hiddenInput) {
            hiddenInput.value = this.dataset.profileValue;
          }
        });
      });
    }
    
    // Handle custom select changes
    if (customSelect) {
      customSelect.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        
        if (this.value) {
          // Deselect all builtin buttons
          if (builtinButtons) {
            builtinButtons.querySelectorAll('button').forEach(btn => {
              btn.classList.remove('active', 'btn-primary', 'btn-secondary', 'btn-info', 'btn-success');
              btn.classList.add('btn-outline-primary', 'btn-outline-secondary', 'btn-outline-info', 'btn-outline-success');
            });
          }
          
          // Show description
          if (descriptionDiv && selectedOption.dataset.description) {
            descriptionDiv.textContent = selectedOption.dataset.description;
            descriptionDiv.style.display = 'block';
          }
          
          // Update hidden input with custom profile name
          if (hiddenInput) {
            hiddenInput.value = this.value;
          }
        } else {
          // Reset to default
          if (descriptionDiv) {
            descriptionDiv.style.display = 'none';
            descriptionDiv.textContent = '';
          }
          if (hiddenInput) {
            hiddenInput.value = '';
          }
        }
      });
    }
    
    // Show custom select if there are custom profiles
    if (customSelect && customSelect.options.length > 1) {
      customSelect.style.display = 'block';
    }
    
    // Initialize default builtin profile value
    const defaultProfile = defaultProfiles[category];
    if (defaultProfile && hiddenInput) {
      // Check if a builtin button with this value exists and is active
      if (builtinButtons) {
        const defaultButton = builtinButtons.querySelector(`[data-profile-value="${defaultProfile}"]`);
        if (defaultButton && defaultButton.classList.contains('active')) {
          hiddenInput.value = defaultProfile;
        }
      } else {
        // If no builtin buttons, set default value anyway
        hiddenInput.value = defaultProfile;
      }
    }
  });
});
</script>
