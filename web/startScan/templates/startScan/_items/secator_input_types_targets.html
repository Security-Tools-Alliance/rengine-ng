{# Input types and proposed targets block - parameterized by id_prefix #}
{# Params: id_prefix (string, e.g. 'subscan', 'start_scan', 'start_org_scan') #}
<div id="{{ id_prefix }}-input-types-targets" class="mt-3 secator-input-types-targets" style="display: none;">
  <div class="card border">
    <div class="card-body">
      <h6 class="card-title small fw-bold mb-2">Required input types</h6>
      <div id="{{ id_prefix }}-input-types-badges" class="mb-3"></div>
      <h6 class="card-title small fw-bold mb-2">Proposed targets</h6>
      <div id="{{ id_prefix }}-targets-single" class="secator-targets-single {% if id_prefix == 'subscan' %}subscan-targets-single{% endif %}">
        <div id="{{ id_prefix }}-targets-toolbar" class="d-flex flex-wrap align-items-center gap-2 mb-2 small" style="display: none;">
          <input type="text" id="{{ id_prefix }}-targets-filter" class="form-control form-control-sm" placeholder="Filter targets..." style="max-width: 220px;" autocomplete="off">
          <div id="{{ id_prefix }}-targets-quick-filters" class="d-flex flex-wrap align-items-center gap-1" title="Filter by type (toggle to filter)">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="http" title="HTTP URLs" aria-label="Filter: HTTP URLs"><i class="fas fa-link"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="https" title="HTTPS URLs" aria-label="Filter: HTTPS URLs"><i class="fas fa-lock"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="email" title="Email" aria-label="Filter: Email"><i class="fas fa-envelope"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="url" title="URL (any scheme)" aria-label="Filter: URL"><i class="fas fa-globe"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="host" title="Host" aria-label="Filter: Host"><i class="fas fa-server"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="host:port" title="Host:port" aria-label="Filter: Host:port"><i class="fas fa-plug"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="ip" title="IP address" aria-label="Filter: IP"><i class="fas fa-network-wired"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="cidr_range" title="CIDR range" aria-label="Filter: CIDR range"><i class="fas fa-th-large"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="common_web_port" title="Common web ports" aria-label="Filter: Common web ports"><i class="fas fa-globe-americas"></i></button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-quick-filter="uncommon_web_port" title="Uncommon web ports" aria-label="Filter: Uncommon web ports"><i class="fas fa-code-branch"></i></button>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ id_prefix }}-targets-select-all">Select all</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ id_prefix }}-targets-deselect-all">Deselect all</button>
          <span id="{{ id_prefix }}-targets-count-text" class="text-muted"></span>
        </div>
        <div id="{{ id_prefix }}-targets-preview" class="small border rounded p-2 bg-light secator-targets-grid" style="max-height: 280px; overflow-y: auto;"></div>
      </div>
      <div id="{{ id_prefix }}-tasks-targets-container" class="secator-tasks-targets-container" style="display: none;"></div>
      <div id="{{ id_prefix }}-targets-warning" class="alert alert-warning small mt-2 mb-0" style="display: none;">No valid targets available for the selected option with the current selection.</div>
      <div id="{{ id_prefix }}-targets-loading" class="text-muted small" style="display: none;"><i class="fas fa-spinner fa-spin"></i> Loading targets...</div>
      <div id="{{ id_prefix }}-targets-error" class="alert alert-danger small mt-2 mb-0" style="display: none;"></div>
    </div>
  </div>
</div>
