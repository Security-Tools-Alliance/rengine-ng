{# Reusable quick search input for DataTables. Expect quick_search_input_id and optional placeholder. #}
<div class="ms-2 mt-1 d-inline-flex align-items-center">
  <label for="{{ quick_search_input_id }}" class="me-1 mb-0 small text-muted">Search</label>
  <input
    type="text"
    id="{{ quick_search_input_id }}"
    class="form-control form-control-sm"
    placeholder="{{ quick_search_placeholder|default:'Type to search' }}"
    autocomplete="off"
  >
</div>
